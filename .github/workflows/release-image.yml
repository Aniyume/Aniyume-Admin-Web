name: Admin Web Release Image

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      next_public_admin_api_base_url:
        description: Public backend API origin baked into the Next.js admin image
        required: false
        default: https://api.example.com
      push_image:
        description: Publish image to GHCR
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_ADMIN_API_BASE_URL: ${{ inputs.next_public_admin_api_base_url || vars.NEXT_PUBLIC_ADMIN_API_BASE_URL || 'https://api.example.com' }}
  NEXT_PUBLIC_UPTIME_KUMA_URL: ${{ vars.NEXT_PUBLIC_UPTIME_KUMA_URL || '' }}
  NEXT_PUBLIC_GRAFANA_URL: ${{ vars.NEXT_PUBLIC_GRAFANA_URL || '' }}
  NEXT_PUBLIC_NOCODB_URL: ${{ vars.NEXT_PUBLIC_NOCODB_URL || '' }}
  NEXT_PUBLIC_UNDERSTAND_ANYTHING_URL: ${{ vars.NEXT_PUBLIC_UNDERSTAND_ANYTHING_URL || '' }}
  NEXT_PUBLIC_UPTIME_KUMA_EMBED: ${{ vars.NEXT_PUBLIC_UPTIME_KUMA_EMBED || 'false' }}
  NEXT_PUBLIC_GRAFANA_EMBED: ${{ vars.NEXT_PUBLIC_GRAFANA_EMBED || 'false' }}
  NEXT_PUBLIC_NOCODB_EMBED: ${{ vars.NEXT_PUBLIC_NOCODB_EMBED || 'false' }}
  NEXT_PUBLIC_UNDERSTAND_ANYTHING_EMBED: ${{ vars.NEXT_PUBLIC_UNDERSTAND_ANYTHING_EMBED || 'false' }}
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Install, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Build
        run: npm run build

  release-image:
    name: Build and publish release image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}
          tags: |
            type=raw,value=release
            type=sha,prefix=release-

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ADMIN_API_BASE_URL=${{ env.NEXT_PUBLIC_ADMIN_API_BASE_URL }}
            NEXT_PUBLIC_UPTIME_KUMA_URL=${{ env.NEXT_PUBLIC_UPTIME_KUMA_URL }}
            NEXT_PUBLIC_GRAFANA_URL=${{ env.NEXT_PUBLIC_GRAFANA_URL }}
            NEXT_PUBLIC_NOCODB_URL=${{ env.NEXT_PUBLIC_NOCODB_URL }}
            NEXT_PUBLIC_UNDERSTAND_ANYTHING_URL=${{ env.NEXT_PUBLIC_UNDERSTAND_ANYTHING_URL }}
            NEXT_PUBLIC_UPTIME_KUMA_EMBED=${{ env.NEXT_PUBLIC_UPTIME_KUMA_EMBED }}
            NEXT_PUBLIC_GRAFANA_EMBED=${{ env.NEXT_PUBLIC_GRAFANA_EMBED }}
            NEXT_PUBLIC_NOCODB_EMBED=${{ env.NEXT_PUBLIC_NOCODB_EMBED }}
            NEXT_PUBLIC_UNDERSTAND_ANYTHING_EMBED=${{ env.NEXT_PUBLIC_UNDERSTAND_ANYTHING_EMBED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
