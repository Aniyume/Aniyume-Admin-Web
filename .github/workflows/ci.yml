name: Admin Web CI

on:
  push:
    branches:
      - dev
      - release
  pull_request:
    branches:
      - dev
      - release

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_ADMIN_API_BASE_URL: http://localhost:8080

jobs:
  build:
    name: Install, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Build
        run: npm run build

  lint:
    name: Lint readiness check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report lint status
        run: |
          echo "Lint script currently uses 'next lint', which prompts for ESLint setup in this scaffold."
          echo "Keeping lint as a non-blocking readiness job until ESLint config is added safely."

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_ADMIN_API_BASE_URL=${NEXT_PUBLIC_ADMIN_API_BASE_URL} \
            -t aniyume-admin-web:ci .
